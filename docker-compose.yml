version: '3.9'

services:
  db:
    image: postgres:16
    container_name: toolhub_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - toolhub_net

  backend:
    build: ./backend
    container_name: toolhub_backend
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - toolhub_net


  frontend:
    build: ./frontend
    container_name: toolhub_frontend
    depends_on:
      - backend
    networks:
      - toolhub_net

  proxy:
    image: nginx:alpine
    container_name: toolhub_proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - toolhub_net

networks:
  toolhub_net:
    driver: bridge

volumes:
  postgres_data: