events { }

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend$request_uri;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend/;
        }
    }
}

